<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ورود | دانش‌آموز فوق‌العاده</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="container">
  <section class="card form-card">
    <div class="center"><div class="brand-mark" style="margin:auto">🌱</div><h1>خوش اومدی!</h1><p class="lead">برای ادامه‌ی مسیر یادگیری وارد حساب خودت شو.</p></div>
    <form onsubmit="loginUser(event)">
      <div class="field"><label for="username">نام کاربری</label><input id="username" autocomplete="username" required minlength="3" placeholder="نام کاربری‌ات"></div>
      <div class="field"><label for="password">رمز عبور</label><input id="password" type="password" autocomplete="current-password" required minlength="4" placeholder="رمز عبور"></div>
      <div id="formMessage" aria-live="polite"></div>
      <button class="btn btn-primary" type="submit" style="width:100%">ورود به حساب ←</button>
    </form>
    <div class="center" style="margin-top:22px"><span class="small">حساب نداری؟</span> <a href="fantasticstudent.html" style="color:var(--green-dark);font-weight:900">ثبت‌نام کن</a></div>
    <div class="notice">این نسخه‌ی آزمایشی اطلاعات را فقط در همین مرورگر ذخیره می‌کند؛ برای استفاده‌ی واقعی و چنددستگاهی، سرور و امنیت سمت سرور لازم است.</div>
  </section>
</main>
<script src="app.js"></script>
</body></html>
